# --- Required options --- #

title: Aaron Graifman
description: "Data Analyst | Program Evaluation Graduate Student"
author: Aaron Graifman

# --- Navigation --- #

navbar-links:
  Home: "https://aaron13g.github.io/"
  Academic Projects: "/academic-projects/"
  About: "/aboutme/"
  CV: "https://aaron13g.github.io/cv/"

# --- Logo --- #

# avatar: "/assets/img/profile.jpg"
# round-avatar: true

# --- Footer Social Links --- #

social-network-links:
  email: "aaronmgraifman@gmail.com"
  github: aaron13g
  linkedin: aaron-graifman

# --- General Options --- #

share-links-active:
  twitter: false
  facebook: false
  linkedin: false
  vk: false

post_search: false

# --- Colours (Navy Professional Theme) --- #

navbar-col: "#2C3E55"
navbar-text-col: "#FFFFFF"
navbar-children-col: "#F4F7FA"
navbar-border-col: "#1F2A3A"

page-col: "#FFFFFF"
text-col: "#2A2A2A"

link-col: "#2C3E55"
hover-col: "#1F2A3A"

footer-col: "#F4F7FA"
footer-text-col: "#444444"
footer-link-col: "#2C3E55"

# --- Collections --- #

collections:
  academic_projects:
    output: true
    permalink: /academic-projects/:name/

# --- Build options --- #

timezone: "America/Toronto"
markdown: kramdown
highlighter: rouge

# FIXED: cleaner routing for non-blog site
permalink: pretty

kramdown:
  input: GFM

# --- Default YAML values --- #

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
      social-share: false
  -
    scope:
      path: ""
    values:
      layout: "page"

# --- Exclude --- #

exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png
  - docs/

# --- Plugins --- #

plugins:
  - jekyll-sitemap

# --- CSS --- #

site-css:
  - /assets/css/custom.css

