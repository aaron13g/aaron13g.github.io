# --- Required options --- #

title: Aaron Graifman
description: "Data Analyst | Program Evaluation Graduate Student"
author: Aaron Graifman

# --- Navigation --- #

navbar-links:
  Home: "/"
  Academic Projects: "academic-projects"
  Tools: "tools"
  About: "aboutme"
  CV: "https://aaron13g.github.io/cv/"

# --- Logo --- #

# Uncomment once the image is added to /assets/img/profile.jpg
# avatar: "/assets/img/profile.jpg"
# round-avatar: true

# --- Footer Social Links --- #

social-network-links:
  email: "aaronmgraifman@gmail.com"
  github: aaron13g
  linkedin: aaron-graifman

# --- General Options --- #

share-links-active:
  twitter: false
  facebook: false
  linkedin: false
  vk: false

post_search: false

# --- Colours --- #

# Primary navy palette
navbar-col: "#2C3E55"
navbar-text-col: "#FFFFFF"
navbar-children-col: "#F4F7FA"
navbar-border-col: "#1F2A3A"

# Page
page-col: "#FFFFFF"
text-col: "#2A2A2A"

# Links
link-col: "#2C3E55"
hover-col: "#1F2A3A"

# Footer
footer-col: "#F4F7FA"
footer-text-col: "#444444"
footer-link-col: "#2C3E55"

# --- Collections --- #

collections:
  academic_projects:
    output: true
    permalink: /academic-projects/:name/

# --- Build options --- #

timezone: "America/Toronto"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/

kramdown:
  input: GFM

# --- Default YAML values --- #

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
      social-share: false
  -
    scope:
      path: ""
    values:
      layout: "page"

# --- Exclude these files from production site --- #

exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png
  - docs/

plugins:
  - jekyll-sitemap

site-css:
  - /assets/css/custom.css

